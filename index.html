<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kasir Mitra Kaca v8.2.0</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --danger: #c0392b; --info: #2980b9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: #f4f4f4; min-height: 100vh; }
        #loginScreen { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--primary); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 30px; border-radius: 8px; width: 300px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        #mainApp { display: none; height: 100vh; flex-direction: row; }
        .sidebar { width: 340px; background: white; padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; }
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; background: #fdfdfd; }
        input, select, button { width: 100%; padding: 8px; margin: 4px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .row { display: flex; gap: 5px; align-items: center; }
        .btn-add { background: var(--success); color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; }
        .table-cont { flex: 1; background: white; border-radius: 8px; overflow: auto; border: 1px solid #ddd; padding: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .summary-box { background: white; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd; }
        #adminModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; }
        .modal-content { background: white; width: 95%; margin: 10px auto; padding: 20px; border-radius: 8px; max-height: 95vh; overflow-y: auto; }
        .status-tag { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .tag-lunas { background: #d4edda; color: #155724; }
        .tag-hutang { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2>MITRA ALUMINIUM</h2>
        <input type="text" id="userLogin" placeholder="Username">
        <input type="password" id="passLogin" placeholder="Password">
        <button onclick="cekLogin()" style="background:var(--success); color:white; border:none; padding:10px; cursor:pointer;">MASUK</button>
    </div>
</div>

<div id="mainApp">
    <div class="sidebar">
        <h3 id="displayUser">User</h3>
        <button onclick="bukaAdmin()" style="background:var(--info); color:white; border:none; padding:10px; margin-bottom:10px; cursor:pointer;">📂 RIWAYAT & CETAK BON</button>
        <hr>
        <label>Nama Pembeli:</label><input type="text" id="pembeli">
        <div class="row"><input type="number" id="p" placeholder="P"> <span>x</span> <input type="number" id="l" placeholder="L"></div>
        <select id="selKaca"></select>
        <button class="btn-add" onclick="tambahItem()">TAMBAH ITEM</button>
        <button onclick="prosesTransaksi()" style="background:var(--primary); color:white; padding:12px;">SIMPAN & PRINT</button>
    </div>
    <div class="main">
        <div class="table-cont"><table><thead><tr><th>Item</th><th>Subtotal</th><th>Aksi</th></tr></thead><tbody id="billBody"></tbody></table></div>
        <div class="summary-box" id="totalDisplay" style="font-weight:bold;">TOTAL: Rp 0</div>
    </div>
</div>

<div id="adminModal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between;"><h3>MENU TRANSAKSI</h3><button onclick="document.getElementById('adminModal').style.display='none'">TUTUP</button></div>
        
        <div style="background:#fff3cd; padding:10px; margin-bottom:15px;">
            <h4>📋 Riwayat Transaksi (Untuk Semua)</h4>
            <table id="historyTable"><thead><tr><th>Tgl</th><th>Pembeli</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="historyBody"></tbody></table>
        </div>

        <div id="adminPanelOnly">
            <h4>⚙️ Pengaturan Admin</h4>
            <input type="text" id="editKopNama" placeholder="Nama Toko">
            <button onclick="updateKop()">SIMPAN KOP</button>
        </div>
    </div>
</div>

<script>
    let currentUser = { user: "", role: "" };
    const dbRef = firebase.database().ref('mitra_kaca_final');
    let db = { inventory: {"Clear 5mm": {harga:300000, gm:15000}}, users: [{user:"admin", pass:"admin123", role:"admin"}], kop:{nama:"MITRA"}, history: [] };
    let keranjang = [];

    dbRef.on('value', (s) => { if(s.val()) db = s.val(); });

    function cekLogin() {
        const u = document.getElementById('userLogin').value, p = document.getElementById('passLogin').value;
        const f = db.users.find(x => x.user === u && x.pass === p);
        if(f) {
            currentUser = f;
            document.getElementById('loginScreen').style.display='none';
            document.getElementById('mainApp').style.display='flex';
            document.getElementById('displayUser').innerText = "Kasir: " + u;
        } else alert("Gagal!");
    }

    function bukaAdmin() {
        document.getElementById('adminModal').style.display='block';
        // Tampilkan/Sembunyikan menu berdasarkan role
        document.getElementById('adminPanelOnly').style.display = (currentUser.role === 'admin') ? 'block' : 'none';
        
        const body = document.getElementById('historyBody'); body.innerHTML = "";
        db.history.slice().reverse().forEach(h => {
            body.innerHTML += `<tr><td>${h.tgl}</td><td>${h.pembeli}</td><td>${h.total.toLocaleString()}</td><td>${h.status}</td>
            <td><button onclick="cetakUlangInstan(${h.id})">🖨️ CETAK</button></td></tr>`;
        });
    }

    function cetakUlangInstan(id) {
        const h = db.history.find(x => x.id === id);
        if (!h) return;
        const prntWin = window.open('', '_blank', 'height=600,width=800');
        let tBody = h.items.map(it => `<tr><td>${it.jenis}</td><td>Rp ${it.subtotal.toLocaleString()}</td></tr>`).join('');
        prntWin.document.write(`<html><body><h2>${db.kop.nama}</h2><p>Pembeli: ${h.pembeli}</p><table>${tBody}</table><h3>TOTAL: Rp ${h.total.toLocaleString()}</h3><script>window.print(); window.onafterprint=()=>window.close()<\/script></body></html>`);
        prntWin.document.close();
    }
    
    // FUNGSI LAIN: tambahItem, prosesTransaksi, updateKop, dsb...
</script>
</body>
</html>
