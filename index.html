<script>
    // FUNGSI CETAK ULANG: Membuka jendela baru yang bersih dan langsung memicu print
    function cetakUlangInstan(id) {
        const h = db.history.find(x => x.id === id);
        if (!h) return;

        const prntWin = window.open('', '_blank', 'height=600,width=800');
        const sisa = h.total - h.dp;
        const infoBayarText = h.status === "Belum Lunas" ? `<b>SISA: Rp ${sisa.toLocaleString()}</b> (DP: Rp ${h.dp.toLocaleString()})` : "<b>STATUS: LUNAS</b>";

        let tBody = "";
        if(h.items && h.items.length > 0) {
            h.items.forEach(it => {
                tBody += `<tr><td>${it.jenis}</td><td>${it.p}x${it.l}</td><td>${it.qty || 1} Pcs</td><td>${it.detail}</td><td>Rp ${Math.round(it.subtotal).toLocaleString()}</td></tr>`;
            });
        } else {
            tBody += `<tr><td>Data Lama</td><td>-</td><td>-</td><td>-</td><td>Rp ${h.total.toLocaleString()}</td></tr>`;
        }

        let htmlNota = `
            <html>
            <head>
                <title>Cetak Nota - ${h.pembeli}</title>
                <style>
                    @page { size: A5 portrait; margin: 10mm; }
                    body { font-family: sans-serif; font-size: 12px; }
                    .kop { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                    th, td { padding: 8px; border: 1px solid #ccc; text-align: left; }
                    th { background: #eee; }
                </style>
            </head>
            <body>
                <div class="kop">
                    <h2 style="margin:0;">${db.kop.nama}</h2>
                    <p style="margin:0;">${db.kop.alamat} | Telp: ${db.kop.telp}</p>
                </div>
                <div><b>Pembeli:</b> ${h.pembeli} | <b>Tanggal:</b> ${h.tgl}</div>
                <table>
                    <thead><tr><th>Item</th><th>Ukuran</th><th>Qty</th><th>Detail</th><th>Subtotal</th></tr></thead>
                    <tbody>${tBody}</tbody>
                </table>
                <div style="margin-top:15px; text-align:right; font-size:16px; font-weight:bold;">
                    TOTAL: Rp ${h.total.toLocaleString()}
                </div>
                <div style="margin-top:10px;">${infoBayarText}</div>
                <script>window.print(); window.onafterprint = () => window.close();<\/script>
            </body>
            </html>`;

        prntWin.document.write(htmlNota);
        prntWin.document.close();
    }
</script>
